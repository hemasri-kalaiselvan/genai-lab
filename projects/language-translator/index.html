<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Translator — Generative AI Lab</title>
<style>
  :root{--ink:#1b1a17;--paper:#f7f5f0;--line:#d8d3c7;--accent:#6a4b78;--accent-soft:#efe8f2;--amber:#b8752c;}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;font-family:Georgia,'Iowan Old Style',serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center}
  header{width:100%;max-width:900px;padding:28px 20px 14px;border-bottom:1px solid var(--line)}
  header a{font:0.78rem 'Helvetica Neue',Arial,sans-serif;color:var(--amber);text-decoration:none}
  header h1{margin:10px 0 0;font-size:1.6rem;font-weight:normal}
  header p{margin:6px 0 0;font:0.9rem/1.5 'Helvetica Neue',Arial,sans-serif;color:#6b675e}
  main{width:100%;max-width:900px;flex:1;padding:20px}
  #setup{font:0.88rem 'Helvetica Neue',Arial,sans-serif;color:#6b675e}
  label{display:block;margin-top:12px}
  input,select,textarea{width:100%;margin-top:6px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font:inherit}
  textarea{min-height:180px;padding:12px;resize:vertical;font-size:.98rem;line-height:1.6}
  .row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-top:12px}
  .swap{width:38px;height:38px;margin-bottom:0;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--accent);cursor:pointer;font-size:1.05rem}
  .options{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
  .options label{display:flex;align-items:center;gap:6px;margin:0;color:#57544d}
  .options input{width:auto;margin:0}
  button.primary{font:0.9rem 'Helvetica Neue',Arial,sans-serif;background:var(--accent);color:#fff;border:0;padding:10px 22px;border-radius:3px;cursor:pointer;margin-top:18px}
  button.primary:disabled{opacity:.5;cursor:default}
  #status{margin-top:14px;font:0.82rem 'Helvetica Neue',Arial,sans-serif;color:#8a8578}
  #result{display:none;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  .result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  .result-head h2{font-size:1rem;font-weight:normal;margin:0}
  #resultBox{background:var(--accent-soft);padding:18px 20px;border-radius:4px;line-height:1.7;white-space:pre-wrap;font-size:1.02rem}
  #detected{margin-top:8px;font:0.78rem 'Helvetica Neue',Arial,sans-serif;color:#777166}
  .copy-btn{font:0.75rem 'Helvetica Neue',Arial,sans-serif;color:var(--accent);background:none;border:1px solid var(--line);border-radius:3px;padding:4px 10px;cursor:pointer}
  .copy-btn.copied{color:#3f6b4f;border-color:#3f6b4f}
  @media(max-width:560px){.row{grid-template-columns:1fr}.swap{transform:rotate(90deg);margin:0 auto}.row label{margin-top:0}textarea{min-height:150px}}
</style>
</head>
<body>
<header>
  <a href="../../">&larr; Generative AI Lab</a>
  <h1>Language Translator</h1>
  <p>Translate text naturally while preserving its meaning, names, numbers, paragraphs, and lists.</p>
</header>
<main>
  <div id="setup">
    <label for="apiKey">Your free Groq API key</label>
    <input id="apiKey" type="password" placeholder="Paste your key here — get one at console.groq.com/keys">

    <div class="row">
      <div><label for="sourceLanguage">From</label><select id="sourceLanguage"></select></div>
      <button class="swap" id="swapBtn" type="button" title="Swap languages" aria-label="Swap languages">⇄</button>
      <div><label for="targetLanguage">To</label><select id="targetLanguage"></select></div>
    </div>

    <label for="inputText">Text to translate</label>
    <textarea id="inputText" placeholder="Type or paste text here..."></textarea>

    <div class="options">
      <label><input id="preserveFormatting" type="checkbox" checked> Preserve paragraphs and lists</label>
      <label><input id="formalTone" type="checkbox"> Use a formal tone</label>
    </div>

    <button class="primary" id="translateBtn" disabled>Translate</button>
    <div id="status"></div>
  </div>

  <section id="result">
    <div class="result-head"><h2 id="resultTitle">Translation</h2><button class="copy-btn" id="copyBtn" type="button">Copy</button></div>
    <div id="resultBox"></div>
    <div id="detected"></div>
  </section>
</main>
<script>
const LANGUAGES=['Arabic','Bengali','Chinese (Simplified)','Chinese (Traditional)','Dutch','English','French','German','Gujarati','Hindi','Italian','Japanese','Kannada','Korean','Malayalam','Marathi','Portuguese','Punjabi','Russian','Spanish','Tamil','Telugu','Thai','Turkish','Urdu','Vietnamese'];
const apiKeyInput=document.getElementById('apiKey');
const sourceLanguage=document.getElementById('sourceLanguage');
const targetLanguage=document.getElementById('targetLanguage');
const swapBtn=document.getElementById('swapBtn');
const inputText=document.getElementById('inputText');
const preserveFormatting=document.getElementById('preserveFormatting');
const formalTone=document.getElementById('formalTone');
const translateBtn=document.getElementById('translateBtn');
const status=document.getElementById('status');
const result=document.getElementById('result');
const resultTitle=document.getElementById('resultTitle');
const resultBox=document.getElementById('resultBox');
const detected=document.getElementById('detected');
const copyBtn=document.getElementById('copyBtn');

function addOption(select,value,label=value){const option=document.createElement('option');option.value=value;option.textContent=label;select.appendChild(option)}
addOption(sourceLanguage,'Auto-detect','Auto-detect');LANGUAGES.forEach(language=>addOption(sourceLanguage,language));
LANGUAGES.forEach(language=>addOption(targetLanguage,language));targetLanguage.value='Tamil';

apiKeyInput.value=localStorage.getItem('genai_lab_groq_key')||'';
apiKeyInput.addEventListener('input',()=>localStorage.setItem('genai_lab_groq_key',apiKeyInput.value.trim()));
inputText.addEventListener('input',()=>{translateBtn.disabled=inputText.value.trim().length===0});
swapBtn.addEventListener('click',()=>{
  if(sourceLanguage.value==='Auto-detect'){status.textContent='Choose a source language before swapping.';return}
  const previous=sourceLanguage.value;sourceLanguage.value=targetLanguage.value;targetLanguage.value=previous;status.textContent='';
  if(resultBox.textContent){inputText.value=resultBox.textContent;translateBtn.disabled=false;result.style.display='none'}
});

const MODEL_PREFERENCE=['llama-3.1-8b-instant','moonshotai/kimi-k2-instruct','llama-3.3-70b-versatile','openai/gpt-oss-120b','openai/gpt-oss-20b','qwen/qwen3.6-27b'];
const NON_CHAT_MODEL=/whisper|tts|guard|prompt-guard/i;
let currentModel=sessionStorage.getItem('genai_lab_groq_model')||null;
async function pickModel(apiKey){
  const res=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:`Bearer ${apiKey}`}});const data=await res.json();
  if(!res.ok)throw new Error(data.error?.message||'Could not fetch the model list.');
  const available=(data.data||[]).map(model=>model.id).filter(id=>!NON_CHAT_MODEL.test(id));
  const chosen=MODEL_PREFERENCE.find(model=>available.includes(model))||available[0];if(!chosen)throw new Error('No chat models are available on this Groq account.');
  currentModel=chosen;sessionStorage.setItem('genai_lab_groq_model',chosen);return chosen;
}
async function callGroq(apiKey,messages,attempt=1){
  if(!currentModel){const chosen=await pickModel(apiKey);status.textContent='Using model: '+chosen}
  const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${apiKey}`},body:JSON.stringify({model:currentModel,messages,response_format:{type:'json_object'}})});const data=await res.json();
  if(data.error&&/does not exist|decommission|not found/i.test(data.error.message||'')&&attempt<3){currentModel=null;sessionStorage.removeItem('genai_lab_groq_model');await pickModel(apiKey);return callGroq(apiKey,messages,attempt+1)}
  if(data.error&&res.status===429&&attempt<3){const h=parseFloat(res.headers.get('retry-after'));const m=parseFloat((data.error.message||'').match(/try again in ([\d.]+)s/i)?.[1]);const wait=Math.min(Math.max(h||m||5,1)+1,60);status.textContent='Rate limit reached — waiting '+Math.ceil(wait)+'s before retrying…';await new Promise(resolve=>setTimeout(resolve,wait*1000));return callGroq(apiKey,messages,attempt+1)}
  if(data.error&&res.status>=500&&attempt<3){await new Promise(resolve=>setTimeout(resolve,attempt*1000));return callGroq(apiKey,messages,attempt+1)}return data;
}

translateBtn.addEventListener('click',async()=>{
  const apiKey=apiKeyInput.value.trim();if(!apiKey){status.textContent='Add your free Groq API key above first.';return}
  const text=inputText.value.trim();if(!text)return;
  translateBtn.disabled=true;result.style.display='none';status.textContent='Translating…';
  const source=sourceLanguage.value;const target=targetLanguage.value;
  const instruction='Translate the supplied text '+(source==='Auto-detect'?'after identifying its language':'from '+source)+' into '+target+'. Preserve all names, numbers, facts, and meaning. '+(preserveFormatting.checked?'Preserve paragraph breaks and list structure. ':'')+(formalTone.checked?'Use a formal, respectful register appropriate to the target language. ':'Use natural wording appropriate to the context. ')+'Do not add explanations inside the translation. Return only valid JSON: {"translation":"...","detected_language":"..."}.';
  try{
    const data=await callGroq(apiKey,[{role:'system',content:'You are an accurate multilingual translator. Never omit, summarize, censor, or invent content. Preserve the intended meaning and return only the requested JSON.'},{role:'user',content:instruction+'\n\nTEXT:\n'+text.slice(0,14000)}]);
    if(data.error){status.textContent='Error: '+data.error.message;return}
    const raw=data.choices?.[0]?.message?.content?.trim()||'';let parsed;try{parsed=JSON.parse(raw)}catch(error){throw new Error('The AI returned an unexpected format. Please try again.')}
    const translation=parsed.translation||'';resultBox.textContent=translation;copyBtn.dataset.raw=translation;
    resultTitle.textContent=target+' translation';detected.textContent=parsed.detected_language?'Detected language: '+parsed.detected_language:'';result.style.display='block';
    status.textContent=text.length>14000?'Only the first 14,000 characters were translated to stay within the free limit.':'';
  }catch(error){status.textContent='Error: '+error.message}finally{translateBtn.disabled=false}
});
copyBtn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(copyBtn.dataset.raw||'');copyBtn.textContent='Copied';copyBtn.classList.add('copied');setTimeout(()=>{copyBtn.textContent='Copy';copyBtn.classList.remove('copied')},1500)}catch(error){copyBtn.textContent='Could not copy'}});
</script>
</body>
</html>
