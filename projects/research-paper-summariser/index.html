<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Research Paper Summariser — Generative AI Lab</title>
<style>
:root{--ink:#1b1a17;--paper:#f6f4ee;--line:#d8d3c7;--accent:#514b75;--soft:#eceaf4;--amber:#b8752c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif}header,main{max-width:920px;margin:auto}header{padding:28px 20px 14px;border-bottom:1px solid var(--line)}header a{font-size:.78rem;color:var(--amber);text-decoration:none}h1{font:normal 1.6rem Georgia,serif;margin:10px 0 0}header p{font-size:.9rem;line-height:1.5;color:#6b675e;margin:6px 0 0}main{padding:20px}.setup{font-size:.87rem;color:#686258}.setup label{display:block;margin-top:12px}input,select,textarea{width:100%;margin-top:6px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:150px;resize:vertical;line-height:1.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.drop{margin-top:16px;padding:18px;border:1px dashed #aaa394;border-radius:6px;background:#fff}.drop input{margin-top:9px}.file-info{font-size:.78rem;color:#7d776c;margin-top:8px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.primary,.secondary{border-radius:4px;padding:9px 16px;cursor:pointer;font:0.86rem 'Helvetica Neue',Arial,sans-serif}.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:#58544d}.primary:disabled{opacity:.45;cursor:default}#status{min-height:20px;margin-top:12px;font-size:.8rem;color:#817b70}#result{display:none;margin-top:23px;padding-top:18px;border-top:1px solid var(--line)}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.result-head h2{font:normal 1.12rem Georgia,serif;margin:0}.result-buttons{display:flex;gap:7px}#resultBox{margin-top:10px;background:var(--soft);padding:20px;border-radius:6px;font:1rem/1.62 Georgia,serif}#resultBox h1,#resultBox h2,#resultBox h3{font-family:'Helvetica Neue',Arial,sans-serif;margin:18px 0 7px}#resultBox h1{font-size:1.3rem}#resultBox h2{font-size:1.05rem}#resultBox h3{font-size:.98rem}#resultBox p{margin:0 0 10px}#resultBox ul{padding-left:22px}.notice{margin-top:9px;font-size:.77rem;color:#777166}@media(max-width:560px){.row{grid-template-columns:1fr}.result-head{align-items:flex-start;flex-direction:column}.actions>*{flex:1}}
</style></head><body>
<header><a href="../../">&larr; Generative AI Lab</a><h1>Research Paper Summariser</h1><p>Turn a dense research article into a structured, plain-language analysis without inventing missing details.</p></header>
<main><div class="setup">
  <label for="apiKey">Your free Groq API key</label><input id="apiKey" type="password" placeholder="Paste your key here — get one at console.groq.com/keys">
  <div class="drop"><strong>Upload a paper</strong><input id="paperFile" type="file" accept=".pdf,.txt,application/pdf,text/plain"><div class="file-info" id="fileInfo">PDF or TXT; text is extracted in your browser.</div></div>
  <label for="paperText">Or paste paper text</label><textarea id="paperText" placeholder="Paste the abstract, full paper, or selected sections here..."></textarea>
  <div class="row"><label for="audience">Explanation level<select id="audience"><option value="a beginner who needs technical terms explained simply">Beginner</option><option value="an engineering student familiar with basic research concepts" selected>Engineering student</option><option value="a researcher who wants a concise technical synthesis">Researcher</option></select></label><label for="focus">Primary focus<select id="focus"><option value="give balanced attention to all sections" selected>Balanced overview</option><option value="focus especially on the methodology and reproducibility">Methodology</option><option value="focus especially on results, comparisons, and evidence">Results</option><option value="focus especially on limitations and research gaps">Limitations and gaps</option></select></label></div>
  <div class="actions"><button class="primary" id="summariseBtn" disabled>Summarise paper</button><button class="secondary" id="clearBtn">Clear</button></div><div id="status"></div>
</div>
<section id="result"><div class="result-head"><h2>Structured paper summary</h2><div class="result-buttons"><button class="secondary" id="copyBtn">Copy</button><button class="secondary" id="downloadBtn">Download</button></div></div><div id="resultBox"></div><div class="notice" id="notice"></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const apiKeyInput=document.getElementById('apiKey'),paperFile=document.getElementById('paperFile'),fileInfo=document.getElementById('fileInfo'),paperText=document.getElementById('paperText'),audience=document.getElementById('audience'),focus=document.getElementById('focus'),summariseBtn=document.getElementById('summariseBtn'),clearBtn=document.getElementById('clearBtn'),status=document.getElementById('status'),result=document.getElementById('result'),resultBox=document.getElementById('resultBox'),notice=document.getElementById('notice'),copyBtn=document.getElementById('copyBtn'),downloadBtn=document.getElementById('downloadBtn');
apiKeyInput.value=localStorage.getItem('genai_lab_groq_key')||'';apiKeyInput.addEventListener('input',()=>localStorage.setItem('genai_lab_groq_key',apiKeyInput.value.trim()));paperText.addEventListener('input',updateReady);let extractedText='',paperName='',rawSummary='';function updateReady(){summariseBtn.disabled=!(paperText.value.trim()||extractedText.trim())}
paperFile.addEventListener('change',async()=>{const file=paperFile.files[0];if(!file)return;paperName=file.name;extractedText='';summariseBtn.disabled=true;result.style.display='none';status.textContent='Extracting text…';try{if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){const buffer=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buffer}).promise;const pages=[];for(let i=1;i<=pdf.numPages;i++){status.textContent='Extracting page '+i+' of '+pdf.numPages+'…';const page=await pdf.getPage(i),content=await page.getTextContent();pages.push(content.items.map(item=>item.str).join(' '))}extractedText=pages.join('\n\n');fileInfo.textContent=file.name+' — '+pdf.numPages+' pages, '+extractedText.length.toLocaleString()+' characters extracted'}else{extractedText=await file.text();fileInfo.textContent=file.name+' — '+extractedText.length.toLocaleString()+' characters extracted'}status.textContent=extractedText.trim()?'':'No readable text was found. This may be a scanned PDF.';updateReady()}catch(error){status.textContent='Could not read this file: '+error.message;fileInfo.textContent='PDF or TXT; text is extracted in your browser.'}});
function representativeSample(text){const clean=text.replace(/\s+/g,' ').trim();if(clean.length<=14000)return{content:clean,sampled:false};const first=clean.slice(0,7000),middleStart=Math.max(7000,Math.floor(clean.length/2)-1750),middle=clean.slice(middleStart,middleStart+3500),last=clean.slice(-3500);return{content:'[BEGINNING OF PAPER]\n'+first+'\n\n[MIDDLE EXCERPT]\n'+middle+'\n\n[ENDING / CONCLUSION EXCERPT]\n'+last,sampled:true}}
const MODEL_PREFERENCE=['llama-3.1-8b-instant','moonshotai/kimi-k2-instruct','llama-3.3-70b-versatile','openai/gpt-oss-120b','openai/gpt-oss-20b','qwen/qwen3.6-27b'],NON_CHAT_MODEL=/whisper|tts|guard|prompt-guard/i;let currentModel=sessionStorage.getItem('genai_lab_groq_model')||null;
async function pickModel(key){const res=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:`Bearer ${key}`}}),data=await res.json();if(!res.ok)throw new Error(data.error?.message||'Could not fetch models.');const available=(data.data||[]).map(m=>m.id).filter(id=>!NON_CHAT_MODEL.test(id)),chosen=MODEL_PREFERENCE.find(m=>available.includes(m))||available[0];if(!chosen)throw new Error('No chat model is available.');currentModel=chosen;sessionStorage.setItem('genai_lab_groq_model',chosen)}
async function callGroq(key,messages,attempt=1){if(!currentModel)await pickModel(key);const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${key}`},body:JSON.stringify({model:currentModel,messages})}),data=await res.json();if(data.error&&/does not exist|decommission|not found/i.test(data.error.message||'')&&attempt<3){currentModel=null;sessionStorage.removeItem('genai_lab_groq_model');await pickModel(key);return callGroq(key,messages,attempt+1)}if(data.error&&res.status===429&&attempt<3){const wait=Math.min(Math.max(parseFloat(res.headers.get('retry-after'))||parseFloat((data.error.message||'').match(/try again in ([\d.]+)s/i)?.[1])||5,1)+1,60);status.textContent='Rate limit reached — retrying in '+Math.ceil(wait)+' seconds…';await new Promise(r=>setTimeout(r,wait*1000));return callGroq(key,messages,attempt+1)}return data}
summariseBtn.addEventListener('click',async()=>{const key=apiKeyInput.value.trim();if(!key){status.textContent='Add your free Groq API key first.';return}const full=(paperText.value.trim()||extractedText.trim());if(!full)return;const sample=representativeSample(full);summariseBtn.disabled=true;result.style.display='none';status.textContent='Analysing the paper…';const instruction='Analyse the supplied research-paper text for '+audience.value+' and '+focus.value+'. Use only evidence present in the text. If an item is missing, write "Not stated in the supplied text". Clearly distinguish author claims from demonstrated evidence. Return markdown with exactly these sections: # Paper title or identification; ## Plain-language overview; ## Research problem and objective; ## Main contribution or novelty; ## Methodology; ## Dataset, materials, or experimental setup; ## Key findings and evidence; ## Comparisons or baselines; ## Limitations stated by the authors; ## Additional limitations visible from the supplied text; ## Future work and research opportunities; ## Five key terms explained. Do not fabricate citation details, numerical results, datasets, equations, or limitations.\n\nFILE NAME: '+(paperName||'not provided')+'\n\nPAPER TEXT:\n'+sample.content;try{const data=await callGroq(key,[{role:'system',content:'You are a careful research-paper analyst. Remain faithful to the supplied text, flag missing information, and never invent evidence.'},{role:'user',content:instruction}]);if(data.error){status.textContent='Error: '+data.error.message;return}rawSummary=data.choices?.[0]?.message?.content?.trim()||'';resultBox.innerHTML=DOMPurify.sanitize(marked.parse(rawSummary));notice.textContent=sample.sampled?'This long paper was represented using excerpts from its beginning, middle, and ending to fit the free request limit. Verify detailed claims against the full paper.':'Summary based on all supplied text.';result.style.display='block';status.textContent=''}catch(error){status.textContent='Error: '+error.message}finally{summariseBtn.disabled=false}});
copyBtn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(rawSummary);copyBtn.textContent='Copied';setTimeout(()=>copyBtn.textContent='Copy',1500)}catch(error){copyBtn.textContent='Could not copy'}});downloadBtn.addEventListener('click',()=>{const blob=new Blob([rawSummary],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='research-paper-summary.md';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});clearBtn.addEventListener('click',()=>{paperFile.value='';paperText.value='';extractedText='';paperName='';rawSummary='';fileInfo.textContent='PDF or TXT; text is extracted in your browser.';result.style.display='none';summariseBtn.disabled=true;status.textContent=''});
</script></body></html>
