<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Interview Practice — Generative AI Lab</title>
<style>
:root{--ink:#1b1a17;--paper:#f6f4ee;--line:#d8d3c7;--accent:#3f566e;--soft:#e7edf2;--amber:#b8752c;--good:#3f6b4f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif}header,main{max-width:880px;margin:auto}header{padding:28px 20px 14px;border-bottom:1px solid var(--line)}header a{font-size:.78rem;color:var(--amber);text-decoration:none}h1{font:normal 1.6rem Georgia,serif;margin:10px 0 0}header p{font-size:.9rem;line-height:1.5;color:#6b675e;margin:6px 0 0}main{padding:20px}.setup{font-size:.87rem;color:#686258}.setup label{display:block;margin-top:12px}input,select,textarea{width:100%;margin-top:6px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:150px;resize:vertical;line-height:1.55}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.primary,.secondary{border-radius:4px;padding:9px 16px;cursor:pointer;font:0.86rem 'Helvetica Neue',Arial,sans-serif}.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:#58544d}.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}#status{min-height:20px;margin-top:12px;font-size:.8rem;color:#817b70}
#session{display:none;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.progress{font:0.78rem 'Courier New',monospace;color:#777166;margin-bottom:9px}.question{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px;font:normal 1.08rem/1.55 Georgia,serif}.hint{font-size:.77rem;color:#817b70;margin:8px 0 0}.feedback{display:none;margin-top:14px;padding:16px;background:var(--soft);border-radius:5px;line-height:1.5}.feedback h3{font:normal 1rem Georgia,serif;margin:0 0 9px}.badge{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--accent);color:#fff;font-size:.76rem;margin-bottom:8px}.feedback p{margin:5px 0;font-size:.87rem}.final{display:none;margin-top:17px;padding:18px;border:1px solid #b9c8ba;background:#edf3ec;border-radius:6px}.final h2{font:normal 1.15rem Georgia,serif;margin:0 0 8px}.final ul{padding-left:20px;line-height:1.5}.answer-label{display:block;margin-top:14px;font-size:.87rem;color:#686258}
@media(max-width:620px){.row{grid-template-columns:1fr}.actions>*{flex:1}}
</style></head><body>
<header><a href="../../">&larr; Generative AI Lab</a><h1>AI Interview Practice</h1><p>Run a role-specific mock interview and receive scoring, feedback, and stronger-answer guidance after every response.</p></header>
<main>
<div class="setup" id="setup">
  <label for="apiKey">Your free Groq API key</label><input id="apiKey" type="password" placeholder="Paste your key here — get one at console.groq.com/keys">
  <label for="role">Target role or interview subject</label><input id="role" type="text" placeholder="e.g. Assistant Professor in ECE, Python developer, MBA placement interview">
  <div class="row">
    <label for="level">Experience level<select id="level"><option>Entry level</option><option selected>Mid-level</option><option>Senior</option></select></label>
    <label for="style">Interview focus<select id="style"><option value="technical and role-specific">Technical</option><option value="behavioural and situational">Behavioural</option><option value="a balanced mix of technical, behavioural, and situational" selected>Mixed</option></select></label>
    <label for="count">Questions<select id="count"><option selected>5</option><option>8</option><option>10</option></select></label>
  </div>
  <label for="context">Job description or special requirements (optional)</label><textarea id="context" placeholder="Paste the job description, required skills, or areas you want the interview to cover..."></textarea>
  <div class="actions"><button class="primary" id="startBtn" disabled>Start interview</button><button class="secondary" id="clearBtn">Clear</button></div><div id="status"></div>
</div>
<section id="session">
  <div class="progress" id="progress"></div><div class="question" id="question"></div>
  <label class="answer-label" for="answer">Your answer</label><textarea id="answer" placeholder="Type your answer as you would give it in the interview..."></textarea><p class="hint">Aim for a clear, specific response. For behavioural questions, the STAR structure can help.</p>
  <div class="actions"><button class="primary" id="submitBtn" disabled>Submit answer</button><button class="secondary" id="nextBtn" style="display:none">Next question</button></div>
  <div class="feedback" id="feedback"><span class="badge" id="scoreBadge"></span><h3>Interview feedback</h3><p id="strength"></p><p id="improvement"></p><p id="example"></p></div>
  <div class="final" id="final"><h2>Interview complete</h2><div id="finalScore"></div><ul id="summaryList"></ul><div class="actions"><button class="secondary" id="downloadBtn">Download report</button><button class="primary" id="restartBtn">Practise again</button></div></div>
</section>
<script>
const apiKeyInput=document.getElementById('apiKey'),role=document.getElementById('role'),level=document.getElementById('level'),style=document.getElementById('style'),count=document.getElementById('count'),context=document.getElementById('context'),startBtn=document.getElementById('startBtn'),clearBtn=document.getElementById('clearBtn'),status=document.getElementById('status'),session=document.getElementById('session'),progress=document.getElementById('progress'),question=document.getElementById('question'),answer=document.getElementById('answer'),submitBtn=document.getElementById('submitBtn'),nextBtn=document.getElementById('nextBtn'),feedback=document.getElementById('feedback'),scoreBadge=document.getElementById('scoreBadge'),strength=document.getElementById('strength'),improvement=document.getElementById('improvement'),example=document.getElementById('example'),final=document.getElementById('final'),finalScore=document.getElementById('finalScore'),summaryList=document.getElementById('summaryList'),downloadBtn=document.getElementById('downloadBtn'),restartBtn=document.getElementById('restartBtn');
apiKeyInput.value=localStorage.getItem('genai_lab_groq_key')||'';apiKeyInput.addEventListener('input',()=>localStorage.setItem('genai_lab_groq_key',apiKeyInput.value.trim()));role.addEventListener('input',()=>startBtn.disabled=!role.value.trim());answer.addEventListener('input',()=>submitBtn.disabled=!answer.value.trim());
const MODEL_PREFERENCE=['llama-3.1-8b-instant','moonshotai/kimi-k2-instruct','llama-3.3-70b-versatile','openai/gpt-oss-120b','openai/gpt-oss-20b','qwen/qwen3.6-27b'];const NON_CHAT_MODEL=/whisper|tts|guard|prompt-guard/i;let currentModel=sessionStorage.getItem('genai_lab_groq_model')||null;let questions=[],current=0,results=[];
async function pickModel(apiKey){const res=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:`Bearer ${apiKey}`}});const data=await res.json();if(!res.ok)throw new Error(data.error?.message||'Could not fetch the model list.');const available=(data.data||[]).map(m=>m.id).filter(id=>!NON_CHAT_MODEL.test(id));const chosen=MODEL_PREFERENCE.find(m=>available.includes(m))||available[0];if(!chosen)throw new Error('No chat models are available on this Groq account.');currentModel=chosen;sessionStorage.setItem('genai_lab_groq_model',chosen);return chosen}
async function callGroq(apiKey,messages,attempt=1){if(!currentModel)await pickModel(apiKey);const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${apiKey}`},body:JSON.stringify({model:currentModel,messages,response_format:{type:'json_object'}})});const data=await res.json();if(data.error&&/does not exist|decommission|not found/i.test(data.error.message||'')&&attempt<3){currentModel=null;sessionStorage.removeItem('genai_lab_groq_model');await pickModel(apiKey);return callGroq(apiKey,messages,attempt+1)}if(data.error&&res.status===429&&attempt<3){const h=parseFloat(res.headers.get('retry-after')),m=parseFloat((data.error.message||'').match(/try again in ([\d.]+)s/i)?.[1]),wait=Math.min(Math.max(h||m||5,1)+1,60);status.textContent='Rate limit reached — retrying in '+Math.ceil(wait)+' seconds…';await new Promise(r=>setTimeout(r,wait*1000));return callGroq(apiKey,messages,attempt+1)}return data}
function parseJSON(data){if(data.error)throw new Error(data.error.message);try{return JSON.parse(data.choices?.[0]?.message?.content||'')}catch(error){throw new Error('The AI returned an unexpected format. Please try again.')}}
function showQuestion(){progress.textContent='QUESTION '+(current+1)+' OF '+questions.length;question.textContent=questions[current];answer.value='';answer.disabled=false;submitBtn.disabled=true;submitBtn.style.display='inline-block';nextBtn.style.display='none';feedback.style.display='none';final.style.display='none';answer.focus()}
startBtn.addEventListener('click',async()=>{const apiKey=apiKeyInput.value.trim();if(!apiKey){status.textContent='Add your free Groq API key first.';return}const total=Number(count.value),job=role.value.trim();startBtn.disabled=true;status.textContent='Preparing your interview…';const prompt='Create exactly '+total+' distinct '+style.value+' interview questions for a '+level.value+' candidate applying for: '+job+'. Ask one focused question at a time. Avoid trivia and avoid requesting protected personal information. '+(context.value.trim()?'Use this job context:\n'+context.value.trim().slice(0,7000):'')+'\nReturn only JSON: {"questions":["..."]}.';try{const data=await callGroq(apiKey,[{role:'system',content:'You are a fair professional interviewer. Create practical, relevant, non-discriminatory interview questions.'},{role:'user',content:prompt}]);const parsed=parseJSON(data);if(!Array.isArray(parsed.questions)||parsed.questions.length!==total||parsed.questions.some(q=>!String(q).trim()))throw new Error('The question set was incomplete. Please start again.');questions=parsed.questions.map(String);current=0;results=[];session.style.display='block';showQuestion();status.textContent='';session.scrollIntoView({behavior:'smooth'})}catch(error){status.textContent='Error: '+error.message}finally{startBtn.disabled=false}});
submitBtn.addEventListener('click',async()=>{const response=answer.value.trim();if(!response)return;const apiKey=apiKeyInput.value.trim();submitBtn.disabled=true;answer.disabled=true;status.textContent='Evaluating your answer…';const prompt='Interview role: '+role.value.trim()+'\nExperience: '+level.value+'\nQuestion: '+questions[current]+'\nCandidate answer: '+response+'\nEvaluate only job-related content. Score from 0 to 10. Give one specific strength, one specific improvement, and a concise stronger example answer that does not invent the candidate’s experience. Return only JSON: {"score":0,"strength":"...","improvement":"...","example_answer":"..."}.';try{const data=await callGroq(apiKey,[{role:'system',content:'You are a constructive interview coach. Be specific, fair, concise, and never penalize accent, identity, or writing style unrelated to the role.'},{role:'user',content:prompt}]);const parsed=parseJSON(data);const value=Math.max(0,Math.min(10,Number(parsed.score)));if(!Number.isFinite(value))throw new Error('The evaluation score was invalid. Please try again.');const item={question:questions[current],answer:response,score:value,strength:String(parsed.strength||''),improvement:String(parsed.improvement||''),example:String(parsed.example_answer||'')};results.push(item);scoreBadge.textContent=value.toFixed(1)+' / 10';strength.textContent='Strength: '+item.strength;improvement.textContent='Improve: '+item.improvement;example.textContent='Stronger example: '+item.example;feedback.style.display='block';submitBtn.style.display='none';status.textContent='';if(current<questions.length-1)nextBtn.style.display='inline-block';else finishInterview()}catch(error){status.textContent='Error: '+error.message;submitBtn.disabled=false;answer.disabled=false}});
nextBtn.addEventListener('click',()=>{current++;showQuestion()});
function finishInterview(){const average=results.reduce((sum,item)=>sum+item.score,0)/results.length;finalScore.innerHTML='<strong>Average score: '+average.toFixed(1)+' / 10</strong><br>'+(average>=8?'Strong performance. Focus on polishing the specific improvements below.':average>=6?'Good foundation. Practise the improvement points before the real interview.':'More practice will help. Use the stronger examples as a guide, not a script.');summaryList.replaceChildren();results.forEach((item,index)=>{const li=document.createElement('li');li.textContent='Q'+(index+1)+' ('+item.score.toFixed(1)+'/10): '+item.improvement;summaryList.appendChild(li)});final.style.display='block';nextBtn.style.display='none';final.scrollIntoView({behavior:'smooth',block:'center'})}
downloadBtn.addEventListener('click',()=>{let text='AI INTERVIEW PRACTICE REPORT\nRole: '+role.value.trim()+'\nLevel: '+level.value+'\n\n';results.forEach((item,index)=>{text+='QUESTION '+(index+1)+'\n'+item.question+'\n\nYOUR ANSWER\n'+item.answer+'\n\nSCORE: '+item.score.toFixed(1)+'/10\nSTRENGTH: '+item.strength+'\nIMPROVEMENT: '+item.improvement+'\nSTRONGER EXAMPLE: '+item.example+'\n\n'});const avg=results.reduce((s,i)=>s+i.score,0)/results.length;text+='AVERAGE: '+avg.toFixed(1)+'/10\n';const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='interview-practice-report.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
restartBtn.addEventListener('click',()=>{session.style.display='none';window.scrollTo({top:0,behavior:'smooth'})});clearBtn.addEventListener('click',()=>{role.value='';context.value='';questions=[];results=[];session.style.display='none';startBtn.disabled=true;status.textContent=''});
</script></body></html>
