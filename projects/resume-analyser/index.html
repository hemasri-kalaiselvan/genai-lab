<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Analyser — Generative AI Lab</title>
<style>
  :root{
    --ink:#1b1a17;
    --paper:#f7f5f0;
    --line:#d8d3c7;
    --accent:#3d5a4a;
    --accent-soft:#e7ede9;
    --amber:#b8752c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Georgia', 'Iowan Old Style', serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header{
    width:100%;
    max-width:900px;
    padding:28px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  header a.back{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.78rem;
    color:var(--amber);
    text-decoration:none;
  }
  header h1{
    margin:10px 0 0;
    font-size:1.6rem;
    font-weight:normal;
  }
  header p{
    margin:6px 0 0;
    font-size:0.9rem;
    color:#6b675e;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }

  main{
    width:100%;
    max-width:900px;
    flex:1;
    padding:20px;
  }

  #setup{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.88rem;
    color:#6b675e;
  }
  #setup label{display:block; margin-top:12px;}
  #setup input[type="password"],
  #setup input[type="text"]{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    font-family:inherit;
    margin-top:6px;
  }

  .tabs{
    display:flex;
    gap:6px;
    margin-top:16px;
  }
  .tab{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.82rem;
    padding:6px 14px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:#6b675e;
    cursor:pointer;
  }
  .tab.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }

  .panel{display:none;}
  .panel.active{display:block;}

  .drop{
    margin-top:12px;
    border:1px dashed var(--line);
    border-radius:4px;
    padding:16px;
    text-align:center;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.85rem;
    color:#8a8778;
    cursor:pointer;
    background:#fff;
  }
  .drop.ready{
    border-color:var(--accent);
    color:var(--accent);
  }
  #fileInput{display:none;}

  #pasteArea{
    width:100%;
    min-height:180px;
    margin-top:12px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:4px;
    font-family:inherit;
    font-size:0.95rem;
    resize:vertical;
    background:#fff;
    color:var(--ink);
  }

  button.primary{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.9rem;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:9px 22px;
    border-radius:3px;
    cursor:pointer;
    margin-top:16px;
  }
  button.primary:disabled{opacity:0.5; cursor:default;}

  #status{
    margin-top:14px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.82rem;
    color:#8a8578;
  }

  #result{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--line);
    display:none;
  }
  #resultBox{
    background:var(--accent-soft);
    padding:16px 18px;
    border-radius:4px;
    line-height:1.6;
  }
  #resultBox p{margin:0 0 10px;}
  #resultBox p:last-child{margin-bottom:0;}
  #resultBox ul, #resultBox ol{margin:0 0 10px; padding-left:20px;}
  #resultBox li{margin-bottom:3px;}
  #resultBox h1, #resultBox h2, #resultBox h3{margin:14px 0 6px; font-size:1.05rem;}
  #resultBox h1:first-child, #resultBox h2:first-child, #resultBox h3:first-child{margin-top:0;}
  #resultBox strong{font-weight:700;}
  #resultBox code{
    font-family:'Courier New', monospace;
    font-size:0.88em;
    background:rgba(0,0,0,0.07);
    padding:1px 5px;
    border-radius:3px;
  }
  .copy-btn{
    display:inline-block;
    margin-top:10px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.75rem;
    color:var(--accent);
    background:none;
    border:1px solid var(--line);
    border-radius:3px;
    padding:4px 10px;
    cursor:pointer;
  }
  .copy-btn.copied{color:#3f6b4f; border-color:#3f6b4f;}

  @media (min-width:700px){
    body{ font-size:1.03rem; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="../../">&larr; Generative AI Lab</a>
  <h1>Resume Analyser</h1>
  <p>Upload a resume or paste its text, and get structured feedback on content, clarity, and formatting. Nothing is uploaded anywhere except the extracted text sent to the model.</p>
</header>

<main>
  <div id="setup">
    <label for="apiKey">Your free Groq API key</label>
    <input id="apiKey" type="password" placeholder="Paste your key here — get one at console.groq.com/keys">

    <label for="targetRole">Target role (optional — sharpens the feedback)</label>
    <input id="targetRole" type="text" placeholder="e.g. Senior Backend Engineer">

    <div class="tabs">
      <button type="button" class="tab active" data-panel="uploadPanel">Upload file</button>
      <button type="button" class="tab" data-panel="pastePanel">Paste text</button>
    </div>

    <div class="panel active" id="uploadPanel">
      <div class="drop" id="drop">Click to choose a PDF or .txt file, or drag one here</div>
      <input id="fileInput" type="file" accept="application/pdf,text/plain">
    </div>

    <div class="panel" id="pastePanel">
      <textarea id="pasteArea" placeholder="Paste your resume text here…"></textarea>
    </div>

    <button class="primary" id="analyseBtn" disabled>Analyse resume</button>
    <div id="status"></div>
  </div>

  <div id="result">
    <div id="resultBox"></div>
    <button class="copy-btn" id="copyBtn" type="button">Copy feedback</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const apiKeyInput = document.getElementById('apiKey');
const targetRoleInput = document.getElementById('targetRole');
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const pasteArea = document.getElementById('pasteArea');
const analyseBtn = document.getElementById('analyseBtn');
const status = document.getElementById('status');
const result = document.getElementById('result');
const resultBox = document.getElementById('resultBox');
const copyBtn = document.getElementById('copyBtn');
const tabs = document.querySelectorAll('.tab');

apiKeyInput.value = localStorage.getItem('genai_lab_groq_key') || '';
apiKeyInput.addEventListener('input', () => {
  localStorage.setItem('genai_lab_groq_key', apiKeyInput.value.trim());
});

let docText = '';
let docName = '';
const MAX_CHARS = 14000; // stays safely under free-tier tokens-per-minute caps on most models

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(tab.dataset.panel).classList.add('active');
    refreshReady();
  });
});

pasteArea.addEventListener('input', refreshReady);

function refreshReady() {
  const pastePanelActive = document.getElementById('pastePanel').classList.contains('active');
  const ready = pastePanelActive ? pasteArea.value.trim().length > 0 : docText.length > 0;
  analyseBtn.disabled = !ready;
}

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', (e) => e.preventDefault());
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});

async function handleFile(file) {
  drop.textContent = 'Reading ' + file.name + '…';
  try {
    let text = '';
    if (file.type === 'application/pdf') {
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(it => it.str).join(' ') + '\n\n';
        if (text.length > MAX_CHARS) break;
      }
    } else if (file.type === 'text/plain' || file.name.endsWith('.txt')) {
      text = await file.text();
    } else {
      drop.textContent = 'Only PDF or .txt files are supported — try another file.';
      return;
    }

    docText = text.slice(0, MAX_CHARS);
    docName = file.name;
    drop.textContent = 'Loaded: ' + file.name + (text.length > MAX_CHARS ? ' (using the first ' + MAX_CHARS.toLocaleString() + ' characters)' : '');
    drop.classList.add('ready');
    refreshReady();
  } catch (err) {
    drop.textContent = 'Could not read that file — try another one.';
  }
}

const MODEL_PREFERENCE = [
  'llama-3.1-8b-instant',
  'moonshotai/kimi-k2-instruct',
  'llama-3.3-70b-versatile',
  'openai/gpt-oss-120b',
  'openai/gpt-oss-20b',
  'qwen/qwen3.6-27b'
];
const NON_CHAT_MODEL = /whisper|tts|guard|prompt-guard/i;
let currentModel = sessionStorage.getItem('genai_lab_groq_model') || null;

async function pickModel(apiKey) {
  const res = await fetch('https://api.groq.com/openai/v1/models', {
    headers: { 'Authorization': `Bearer ${apiKey}` }
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'Could not fetch the model list.');
  const available = (data.data || []).map(m => m.id).filter(id => !NON_CHAT_MODEL.test(id));
  const chosen = MODEL_PREFERENCE.find(m => available.includes(m)) || available[0];
  if (!chosen) throw new Error('No chat models are available on this Groq account.');
  currentModel = chosen;
  sessionStorage.setItem('genai_lab_groq_model', chosen);
  return chosen;
}

async function callGroq(apiKey, messages, attempt = 1) {
  if (!currentModel) {
    const chosen = await pickModel(apiKey);
    status.textContent = 'Using model: ' + chosen;
  }

  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    },
    body: JSON.stringify({ model: currentModel, messages })
  });
  const data = await res.json();

  const modelGone = data.error && /does not exist|decommission|not found/i.test(data.error.message || '');
  if (modelGone && attempt < 3) {
    currentModel = null;
    sessionStorage.removeItem('genai_lab_groq_model');
    const chosen = await pickModel(apiKey);
    status.textContent = 'Previous model was retired — switched to: ' + chosen;
    return callGroq(apiKey, messages, attempt + 1);
  }

  const rateLimited = data.error && res.status === 429;
  if (rateLimited && attempt < 3) {
    const headerWait = parseFloat(res.headers.get('retry-after'));
    const messageWait = parseFloat((data.error.message || '').match(/try again in ([\d.]+)s/i)?.[1]);
    const waitSeconds = Math.min(Math.max(headerWait || messageWait || 5, 1) + 1, 60);
    status.textContent = 'Rate limit reached — waiting ' + Math.ceil(waitSeconds) + 's before retrying…';
    await new Promise(r => setTimeout(r, waitSeconds * 1000));
    return callGroq(apiKey, messages, attempt + 1);
  }

  const retryable = data.error && res.status >= 500;
  if (retryable && attempt < 3) {
    await new Promise(r => setTimeout(r, attempt * 1000));
    return callGroq(apiKey, messages, attempt + 1);
  }
  return data;
}

analyseBtn.addEventListener('click', async () => {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) {
    status.textContent = 'Add your free Groq API key above first.';
    return;
  }

  const pastePanelActive = document.getElementById('pastePanel').classList.contains('active');
  const text = pastePanelActive ? pasteArea.value.trim().slice(0, MAX_CHARS) : docText;
  const name = pastePanelActive ? 'pasted resume' : docName;
  if (!text) {
    status.textContent = 'Add a resume first.';
    return;
  }
  const targetRole = targetRoleInput.value.trim();

  analyseBtn.disabled = true;
  result.style.display = 'none';
  status.textContent = 'Analysing…';

  const messages = [
    {
      role: 'system',
      content: 'You are an experienced hiring manager and resume coach. Give honest, specific, actionable feedback. Only reference what is actually in the resume text provided — never invent experience or skills that aren\'t there.'
    },
    {
      role: 'user',
      content: 'Analyse this resume ("' + name + '")' +
        (targetRole ? ' for a "' + targetRole + '" role' : '') +
        '. Structure your response in markdown with these sections: ' +
        '## Overall Impression (2-3 sentences), ' +
        '## Strengths (bulleted), ' +
        '## Areas to Improve (bulleted, specific and actionable), ' +
        '## Formatting & Clarity (note anything that would confuse a recruiter or an ATS system), ' +
        'and ## Suggested Next Steps (2-3 concrete actions).\n\n' +
        'Resume text:\n\n' + text
    }
  ];

  try {
    const data = await callGroq(apiKey, messages);
    if (data.error) {
      status.textContent = 'Error: ' + data.error.message;
      return;
    }
    const feedback = data.choices?.[0]?.message?.content || '(no response)';
    resultBox.innerHTML = DOMPurify.sanitize(marked.parse(feedback));
    result.style.display = 'block';
    status.textContent = '';
    copyBtn.dataset.raw = feedback;
  } catch (err) {
    status.textContent = 'Network error: ' + err.message;
  } finally {
    analyseBtn.disabled = false;
  }
});

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(copyBtn.dataset.raw || '');
    copyBtn.textContent = 'Copied';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copy feedback';
      copyBtn.classList.remove('copied');
    }, 1500);
  } catch (err) {
    copyBtn.textContent = 'Could not copy';
  }
});
</script>

</body>
</html>
