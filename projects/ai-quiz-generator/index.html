<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz Generator — Generative AI Lab</title>
<style>
  :root{--ink:#1b1a17;--paper:#f7f5f0;--line:#d8d3c7;--accent:#485d36;--soft:#eaf0e5;--correct:#2e6b44;--wrong:#a84338;--amber:#b8752c}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif}header,main{width:100%;max-width:900px;margin:auto}header{padding:28px 20px 14px;border-bottom:1px solid var(--line)}header a{font-size:.78rem;color:var(--amber);text-decoration:none}h1{font:normal 1.6rem Georgia,serif;margin:10px 0 0}header p{font-size:.9rem;color:#6b675e;line-height:1.5;margin:6px 0 0}main{padding:20px}.setup{font-size:.87rem;color:#676258}.setup label{display:block;margin-top:12px}input,select,textarea{width:100%;margin-top:6px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:150px;resize:vertical;line-height:1.5}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.primary,.secondary{font:0.86rem 'Helvetica Neue',Arial,sans-serif;border-radius:4px;padding:9px 16px;cursor:pointer}.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:#5d5950}.primary:disabled,.secondary:disabled{opacity:.48;cursor:default}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}#status{min-height:20px;margin-top:12px;font-size:.8rem;color:#817b70}
  #quiz{display:none;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.quiz-head h2{font:normal 1.15rem Georgia,serif;margin:0}.question{background:#fff;border:1px solid var(--line);border-radius:6px;padding:17px;margin-top:12px}.question h3{font:normal 1rem/1.5 Georgia,serif;margin:0 0 12px}.option{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:4px;margin:5px 0;cursor:pointer;line-height:1.4}.option:hover{background:#f4f2ec}.option input{width:auto;margin:2px 0 0}.question.correct{border-color:var(--correct)}.question.wrong{border-color:var(--wrong)}.feedback{display:none;margin-top:11px;padding:10px 12px;border-radius:4px;background:var(--soft);font-size:.85rem;line-height:1.45}.question.graded .feedback{display:block}.question.graded .option{cursor:default}.score{display:none;margin-top:18px;padding:16px;border-radius:5px;background:var(--soft);font:normal 1.08rem Georgia,serif}.score strong{color:var(--accent)}
  @media(max-width:620px){.row{grid-template-columns:1fr}.quiz-head{align-items:flex-start;flex-direction:column}.actions>*{flex:1}}
</style>
</head>
<body>
<header><a href="../../">&larr; Generative AI Lab</a><h1>AI Quiz Generator</h1><p>Create an interactive quiz from any topic, notes, lesson, or pasted study material.</p></header>
<main>
  <div class="setup">
    <label for="apiKey">Your free Groq API key</label><input id="apiKey" type="password" placeholder="Paste your key here — get one at console.groq.com/keys">
    <label for="source">Topic or study material</label><textarea id="source" placeholder="Example: Maximum power transfer theorem in DC and AC circuits, including the matching conditions and efficiency...&#10;&#10;Or paste your class notes here."></textarea>
    <div class="row">
      <label for="count">Questions<select id="count"><option>5</option><option selected>10</option><option>15</option></select></label>
      <label for="difficulty">Difficulty<select id="difficulty"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></label>
      <label for="type">Question type<select id="type"><option value="multiple-choice">Multiple choice</option><option value="true-or-false">True / False</option><option value="a balanced mix of multiple-choice and true-or-false" selected>Mixed</option></select></label>
    </div>
    <div class="actions"><button class="primary" id="generateBtn" disabled>Generate quiz</button><button class="secondary" id="clearBtn">Clear</button></div><div id="status"></div>
  </div>
  <section id="quiz">
    <div class="quiz-head"><h2 id="quizTitle">Generated quiz</h2><button class="secondary" id="downloadBtn">Download quiz</button></div>
    <div id="questionList"></div>
    <div class="actions"><button class="primary" id="submitBtn">Check answers</button><button class="secondary" id="retryBtn">Retry quiz</button></div>
    <div class="score" id="score"></div>
  </section>
</main>
<script>
const apiKeyInput=document.getElementById('apiKey');const source=document.getElementById('source');const count=document.getElementById('count');const difficulty=document.getElementById('difficulty');const type=document.getElementById('type');const generateBtn=document.getElementById('generateBtn');const clearBtn=document.getElementById('clearBtn');const status=document.getElementById('status');const quiz=document.getElementById('quiz');const quizTitle=document.getElementById('quizTitle');const questionList=document.getElementById('questionList');const submitBtn=document.getElementById('submitBtn');const retryBtn=document.getElementById('retryBtn');const score=document.getElementById('score');const downloadBtn=document.getElementById('downloadBtn');
apiKeyInput.value=localStorage.getItem('genai_lab_groq_key')||'';apiKeyInput.addEventListener('input',()=>localStorage.setItem('genai_lab_groq_key',apiKeyInput.value.trim()));source.addEventListener('input',()=>generateBtn.disabled=!source.value.trim());
const MODEL_PREFERENCE=['llama-3.1-8b-instant','moonshotai/kimi-k2-instruct','llama-3.3-70b-versatile','openai/gpt-oss-120b','openai/gpt-oss-20b','qwen/qwen3.6-27b'];const NON_CHAT_MODEL=/whisper|tts|guard|prompt-guard/i;let currentModel=sessionStorage.getItem('genai_lab_groq_model')||null;let quizData=null;
async function pickModel(apiKey){const res=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:`Bearer ${apiKey}`}});const data=await res.json();if(!res.ok)throw new Error(data.error?.message||'Could not fetch the model list.');const available=(data.data||[]).map(model=>model.id).filter(id=>!NON_CHAT_MODEL.test(id));const chosen=MODEL_PREFERENCE.find(model=>available.includes(model))||available[0];if(!chosen)throw new Error('No chat models are available on this Groq account.');currentModel=chosen;sessionStorage.setItem('genai_lab_groq_model',chosen);return chosen}
async function callGroq(apiKey,messages,attempt=1){if(!currentModel)await pickModel(apiKey);const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${apiKey}`},body:JSON.stringify({model:currentModel,messages,response_format:{type:'json_object'}})});const data=await res.json();if(data.error&&/does not exist|decommission|not found/i.test(data.error.message||'')&&attempt<3){currentModel=null;sessionStorage.removeItem('genai_lab_groq_model');await pickModel(apiKey);return callGroq(apiKey,messages,attempt+1)}if(data.error&&res.status===429&&attempt<3){const h=parseFloat(res.headers.get('retry-after'));const m=parseFloat((data.error.message||'').match(/try again in ([\d.]+)s/i)?.[1]);const wait=Math.min(Math.max(h||m||5,1)+1,60);status.textContent='Rate limit reached — retrying in '+Math.ceil(wait)+' seconds…';await new Promise(resolve=>setTimeout(resolve,wait*1000));return callGroq(apiKey,messages,attempt+1)}return data}

function normalizeQuiz(data){
  if(!data||!Array.isArray(data.questions))throw new Error('The AI response did not contain a valid quiz. Please try again.');
  const questions=data.questions.map((item,index)=>{const options=Array.isArray(item.options)?item.options.map(String).slice(0,5):[];const answer=String(item.answer||'').trim();if(!item.question||options.length<2||!options.includes(answer))throw new Error('Question '+(index+1)+' was incomplete. Please generate again.');return{question:String(item.question),options,answer,explanation:String(item.explanation||'')}});
  if(!questions.length)throw new Error('No valid questions were returned.');return{title:String(data.title||'Generated quiz'),questions};
}
function renderQuiz(){questionList.replaceChildren();quizTitle.textContent=quizData.title;quizData.questions.forEach((item,index)=>{const card=document.createElement('article');card.className='question';card.dataset.index=index;const heading=document.createElement('h3');heading.textContent=(index+1)+'. '+item.question;card.appendChild(heading);item.options.forEach(optionText=>{const label=document.createElement('label');label.className='option';const radio=document.createElement('input');radio.type='radio';radio.name='question-'+index;radio.value=optionText;const text=document.createElement('span');text.textContent=optionText;label.append(radio,text);card.appendChild(label)});const feedback=document.createElement('div');feedback.className='feedback';card.appendChild(feedback);questionList.appendChild(card)});score.style.display='none';submitBtn.disabled=false;quiz.style.display='block';quiz.scrollIntoView({behavior:'smooth',block:'start'})}

generateBtn.addEventListener('click',async()=>{const apiKey=apiKeyInput.value.trim();if(!apiKey){status.textContent='Add your free Groq API key first.';return}const material=source.value.trim();if(!material)return;generateBtn.disabled=true;quiz.style.display='none';status.textContent='Creating quiz…';const requested=Number(count.value);const instruction='Create exactly '+requested+' '+difficulty.value.toLowerCase()+' questions using '+type.value+'. Base every question only on the supplied topic or material; do not introduce unsupported facts. Each multiple-choice question must have exactly four plausible options. Each true-or-false question must have options ["True","False"]. The answer must exactly match one option. Give a short teaching explanation. Return only JSON in this structure: {"title":"...","questions":[{"question":"...","options":["..."],"answer":"...","explanation":"..."}]}.\n\nSOURCE:\n'+material.slice(0,14000);try{const data=await callGroq(apiKey,[{role:'system',content:'You are a careful teacher and assessment designer. Produce accurate, unambiguous, objective quiz questions and valid JSON only.'},{role:'user',content:instruction}]);if(data.error){status.textContent='Error: '+data.error.message;return}let parsed;try{parsed=JSON.parse(data.choices?.[0]?.message?.content||'')}catch(error){throw new Error('The AI returned an unexpected format. Please try again.')}quizData=normalizeQuiz(parsed);if(quizData.questions.length!==requested)throw new Error('The AI returned '+quizData.questions.length+' questions instead of '+requested+'. Please generate again.');renderQuiz();status.textContent=material.length>14000?'Only the first 14,000 characters were used to stay within the free limit.':''}catch(error){status.textContent='Error: '+error.message}finally{generateBtn.disabled=false}});
submitBtn.addEventListener('click',()=>{let correct=0;let answered=0;quizData.questions.forEach((item,index)=>{const card=questionList.querySelector('[data-index="'+index+'"]');const chosen=card.querySelector('input:checked');const feedback=card.querySelector('.feedback');card.classList.add('graded');card.classList.remove('correct','wrong');if(chosen){answered++;if(chosen.value===item.answer){correct++;card.classList.add('correct');feedback.textContent='Correct. '+item.explanation}else{card.classList.add('wrong');feedback.textContent='Correct answer: '+item.answer+'. '+item.explanation}}else{card.classList.add('wrong');feedback.textContent='Not answered. Correct answer: '+item.answer+'. '+item.explanation}card.querySelectorAll('input').forEach(input=>input.disabled=true)});const percent=Math.round(correct/quizData.questions.length*100);score.innerHTML='<strong>'+correct+' / '+quizData.questions.length+' ('+percent+'%)</strong> — '+(answered<quizData.questions.length?(quizData.questions.length-answered)+' unanswered. ':'')+(percent>=80?'Excellent work.':percent>=60?'Good effort—review the explanations below.':'Review the explanations and try again.');score.style.display='block';submitBtn.disabled=true;score.scrollIntoView({behavior:'smooth',block:'center'})});
retryBtn.addEventListener('click',()=>{questionList.querySelectorAll('.question').forEach(card=>{card.classList.remove('graded','correct','wrong');card.querySelectorAll('input').forEach(input=>{input.disabled=false;input.checked=false})});score.style.display='none';submitBtn.disabled=false;quiz.scrollIntoView({behavior:'smooth',block:'start'})});
downloadBtn.addEventListener('click',()=>{if(!quizData)return;let text=quizData.title+'\n'+'='.repeat(quizData.title.length)+'\n\n';quizData.questions.forEach((item,index)=>{text+=(index+1)+'. '+item.question+'\n';item.options.forEach((option,i)=>text+='   '+String.fromCharCode(65+i)+'. '+option+'\n');text+='\n'});text+='ANSWER KEY\n----------\n';quizData.questions.forEach((item,index)=>text+=(index+1)+'. '+item.answer+' — '+item.explanation+'\n');const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='ai-quiz.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
clearBtn.addEventListener('click',()=>{source.value='';quizData=null;quiz.style.display='none';generateBtn.disabled=true;status.textContent=''});
</script>
</body>
</html>
