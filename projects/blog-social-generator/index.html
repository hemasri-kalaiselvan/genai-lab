<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog &amp; Social Content Generator — Generative AI Lab</title>
<style>
  :root{
    --ink:#1b1a17;
    --paper:#f7f5f0;
    --line:#d8d3c7;
    --accent:#3d5a4a;
    --accent-soft:#e7ede9;
    --amber:#b8752c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Georgia', 'Iowan Old Style', serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header{
    width:100%;
    max-width:900px;
    padding:28px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  header a.back{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.78rem;
    color:var(--amber);
    text-decoration:none;
  }
  header h1{
    margin:10px 0 0;
    font-size:1.6rem;
    font-weight:normal;
  }
  header p{
    margin:6px 0 0;
    font-size:0.9rem;
    color:#6b675e;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }

  main{
    width:100%;
    max-width:900px;
    flex:1;
    padding:20px;
  }

  #setup{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.88rem;
    color:#6b675e;
  }
  #setup label{display:block; margin-top:12px;}
  #setup input[type="password"],
  #setup input[type="text"]{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    font-family:inherit;
    margin-top:6px;
  }
  textarea{
    width:100%;
    min-height:110px;
    margin-top:6px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:4px;
    font-family:inherit;
    font-size:0.95rem;
    resize:vertical;
    background:#fff;
    color:var(--ink);
  }

  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:12px;
  }
  @media (max-width:520px){
    .row2{grid-template-columns:1fr;}
  }
  select{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    font-family:inherit;
    background:#fff;
    margin-top:6px;
  }

  .format-tabs{
    display:flex;
    gap:6px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .format-tab{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.8rem;
    padding:6px 14px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:#6b675e;
    cursor:pointer;
  }
  .format-tab.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }

  button.primary{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.9rem;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:9px 22px;
    border-radius:3px;
    cursor:pointer;
    margin-top:18px;
  }
  button.primary:disabled{opacity:0.5; cursor:default;}

  #status{
    margin-top:14px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.82rem;
    color:#8a8578;
  }

  #result{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--line);
    display:none;
  }
  #resultBox{
    background:var(--accent-soft);
    padding:18px 20px;
    border-radius:4px;
    line-height:1.65;
  }
  #resultBox p{margin:0 0 10px;}
  #resultBox p:last-child{margin-bottom:0;}
  #resultBox ul, #resultBox ol{margin:0 0 10px; padding-left:20px;}
  #resultBox li{margin-bottom:3px;}
  #resultBox h1, #resultBox h2, #resultBox h3{margin:14px 0 6px; font-size:1.05rem;}
  #resultBox h1:first-child, #resultBox h2:first-child, #resultBox h3:first-child{margin-top:0;}
  #resultBox strong{font-weight:700;}
  #resultBox code{
    font-family:'Courier New', monospace;
    font-size:0.88em;
    background:rgba(0,0,0,0.07);
    padding:1px 5px;
    border-radius:3px;
  }
  .copy-btn{
    display:inline-block;
    margin-top:10px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.75rem;
    color:var(--accent);
    background:none;
    border:1px solid var(--line);
    border-radius:3px;
    padding:4px 10px;
    cursor:pointer;
  }
  .copy-btn.copied{color:#3f6b4f; border-color:#3f6b4f;}

  @media (min-width:700px){
    body{ font-size:1.03rem; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="../../">&larr; Generative AI Lab</a>
  <h1>Blog &amp; Social Content Generator</h1>
  <p>Describe a topic and get a draft in the format you need — blog post, LinkedIn post, X/Twitter thread, or Instagram caption.</p>
</header>

<main>
  <div id="setup">
    <label for="apiKey">Your free Groq API key</label>
    <input id="apiKey" type="password" placeholder="Paste your key here — get one at console.groq.com/keys">

    <label for="topicArea">Topic or outline</label>
    <textarea id="topicArea" placeholder="e.g. Why small teams should write architecture decision records — cover what they are, one real example of a decision that went wrong without one, and how to start"></textarea>

    <div class="format-tabs" id="formatTabs">
      <button type="button" class="format-tab active" data-format="blog">Blog post</button>
      <button type="button" class="format-tab" data-format="linkedin">LinkedIn post</button>
      <button type="button" class="format-tab" data-format="twitter">X / Twitter thread</button>
      <button type="button" class="format-tab" data-format="instagram">Instagram caption</button>
    </div>

    <div class="row2">
      <div>
        <label for="tone">Tone</label>
        <select id="tone">
          <option value="clear and professional" selected>Professional</option>
          <option value="casual and conversational">Casual</option>
          <option value="witty and a little irreverent">Witty</option>
          <option value="authoritative and expert">Authoritative</option>
        </select>
      </div>
      <div>
        <label for="audience">Audience (optional)</label>
        <input id="audience" type="text" placeholder="e.g. early-career developers">
      </div>
    </div>

    <button class="primary" id="generateBtn" disabled>Generate</button>
    <div id="status"></div>
  </div>

  <div id="result">
    <div id="resultBox"></div>
    <button class="copy-btn" id="copyBtn" type="button">Copy</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<script>
const apiKeyInput = document.getElementById('apiKey');
const topicArea = document.getElementById('topicArea');
const toneSelect = document.getElementById('tone');
const audienceInput = document.getElementById('audience');
const formatTabs = document.querySelectorAll('.format-tab');
const generateBtn = document.getElementById('generateBtn');
const status = document.getElementById('status');
const result = document.getElementById('result');
const resultBox = document.getElementById('resultBox');
const copyBtn = document.getElementById('copyBtn');

apiKeyInput.value = localStorage.getItem('genai_lab_groq_key') || '';
apiKeyInput.addEventListener('input', () => {
  localStorage.setItem('genai_lab_groq_key', apiKeyInput.value.trim());
});

let selectedFormat = 'blog';
formatTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    formatTabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    selectedFormat = tab.dataset.format;
  });
});

topicArea.addEventListener('input', () => {
  generateBtn.disabled = topicArea.value.trim().length === 0;
});

const FORMAT_INSTRUCTIONS = {
  blog: 'a blog post of about 500-700 words, with a title as an H1, a few H2 subheadings, and short paragraphs. Return markdown.',
  linkedin: 'a LinkedIn post of about 100-200 words — a strong hook in the first line, short paragraphs or line breaks for readability, and 3-5 relevant hashtags at the end. Return plain text, no markdown headers.',
  twitter: 'an X/Twitter thread of 5-8 tweets. Number each tweet (1/, 2/, etc.), keep each under 280 characters, and make the first tweet a strong hook. Return plain text with each tweet on its own line, separated by a blank line.',
  instagram: 'an Instagram caption of about 60-150 words with an engaging first line, a few relevant emojis used naturally (not excessively), and 5-10 relevant hashtags at the end. Return plain text, no markdown headers.'
};

const MODEL_PREFERENCE = [
  'llama-3.1-8b-instant',
  'moonshotai/kimi-k2-instruct',
  'llama-3.3-70b-versatile',
  'openai/gpt-oss-120b',
  'openai/gpt-oss-20b',
  'qwen/qwen3.6-27b'
];
const NON_CHAT_MODEL = /whisper|tts|guard|prompt-guard/i;
let currentModel = sessionStorage.getItem('genai_lab_groq_model') || null;

async function pickModel(apiKey) {
  const res = await fetch('https://api.groq.com/openai/v1/models', {
    headers: { 'Authorization': `Bearer ${apiKey}` }
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'Could not fetch the model list.');
  const available = (data.data || []).map(m => m.id).filter(id => !NON_CHAT_MODEL.test(id));
  const chosen = MODEL_PREFERENCE.find(m => available.includes(m)) || available[0];
  if (!chosen) throw new Error('No chat models are available on this Groq account.');
  currentModel = chosen;
  sessionStorage.setItem('genai_lab_groq_model', chosen);
  return chosen;
}

async function callGroq(apiKey, messages, attempt = 1) {
  if (!currentModel) {
    const chosen = await pickModel(apiKey);
    status.textContent = 'Using model: ' + chosen;
  }

  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    },
    body: JSON.stringify({ model: currentModel, messages })
  });
  const data = await res.json();

  const modelGone = data.error && /does not exist|decommission|not found/i.test(data.error.message || '');
  if (modelGone && attempt < 3) {
    currentModel = null;
    sessionStorage.removeItem('genai_lab_groq_model');
    const chosen = await pickModel(apiKey);
    status.textContent = 'Previous model was retired — switched to: ' + chosen;
    return callGroq(apiKey, messages, attempt + 1);
  }

  const rateLimited = data.error && res.status === 429;
  if (rateLimited && attempt < 3) {
    const headerWait = parseFloat(res.headers.get('retry-after'));
    const messageWait = parseFloat((data.error.message || '').match(/try again in ([\d.]+)s/i)?.[1]);
    const waitSeconds = Math.min(Math.max(headerWait || messageWait || 5, 1) + 1, 60);
    status.textContent = 'Rate limit reached — waiting ' + Math.ceil(waitSeconds) + 's before retrying…';
    await new Promise(r => setTimeout(r, waitSeconds * 1000));
    return callGroq(apiKey, messages, attempt + 1);
  }

  const retryable = data.error && res.status >= 500;
  if (retryable && attempt < 3) {
    await new Promise(r => setTimeout(r, attempt * 1000));
    return callGroq(apiKey, messages, attempt + 1);
  }
  return data;
}

generateBtn.addEventListener('click', async () => {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) {
    status.textContent = 'Add your free Groq API key above first.';
    return;
  }
  const topic = topicArea.value.trim();
  if (!topic) return;

  const tone = toneSelect.value;
  const audience = audienceInput.value.trim();
  const formatInstruction = FORMAT_INSTRUCTIONS[selectedFormat];

  generateBtn.disabled = true;
  result.style.display = 'none';
  status.textContent = 'Writing…';

  const messages = [
    {
      role: 'system',
      content: 'You are a skilled content writer. Write in a ' + tone + ' tone. Only use facts and claims the person actually gave you in the topic/outline — do not invent statistics, quotes, or specific claims not provided. Follow the requested format precisely.'
    },
    {
      role: 'user',
      content: 'Write ' + formatInstruction +
        (audience ? ' Write for this audience: ' + audience + '.' : '') +
        '\n\nTopic / outline:\n' + topic
    }
  ];

  try {
    const data = await callGroq(apiKey, messages);
    if (data.error) {
      status.textContent = 'Error: ' + data.error.message;
      return;
    }
    const content = data.choices?.[0]?.message?.content?.trim() || '(no response)';
    if (selectedFormat === 'blog') {
      resultBox.innerHTML = DOMPurify.sanitize(marked.parse(content));
    } else {
      resultBox.textContent = content;
      resultBox.style.whiteSpace = 'pre-wrap';
    }
    result.style.display = 'block';
    status.textContent = '';
    copyBtn.dataset.raw = content;
  } catch (err) {
    status.textContent = 'Network error: ' + err.message;
  } finally {
    generateBtn.disabled = false;
  }
});

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(copyBtn.dataset.raw || '');
    copyBtn.textContent = 'Copied';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copy';
      copyBtn.classList.remove('copied');
    }, 1500);
  } catch (err) {
    copyBtn.textContent = 'Could not copy';
  }
});
</script>

</body>
</html>
